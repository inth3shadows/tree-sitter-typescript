name: Publish packages

# The GitHub release, the tree-sitter-typescript-next crate and the
# tree-sitter-typescript-next npm package; no PyPI release from this fork until someone
# asks for one. Manual only, so pushing a tag never publishes. Run it from a v<version> tag that matches Cargo.toml.
on:
  workflow_dispatch:

# Write access is granted per job, only where it is used.
permissions:
  contents: read

# No `generate`: these jobs would regenerate the parsers with the latest tree-sitter CLI
# instead of 0.25.10, and `cargo publish` refuses the changed files.
# The shared workflows are pinned to a commit, because their inputs have changed under
# callers before. The actions they call are not pinned by this.
jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag matches the crate version
        run: |
          set -o pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Run this workflow from a v<version> tag, not $GITHUB_REF"
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
  github:
    needs: check
    permissions:   # what tree-sitter/workflows release.yml declares it needs
      contents: write
      id-token: write
      attestations: write
    uses: tree-sitter/workflows/.github/workflows/release.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279
  # After the release, so a failed release never leaves a crate (which can't be removed) behind.
  crates:
    needs: github
    permissions:
      contents: read   # publishes with CARGO_REGISTRY_TOKEN, not the job token
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
    with:
      package-name: tree-sitter-typescript-next
  # After the release, like the crate. npm does not allow a version to be republished.
  npm:
    needs: github
    permissions:
      contents: read   # publishes with NODE_AUTH_TOKEN, not the job token
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279
    secrets:
      NODE_AUTH_TOKEN: ${{secrets.NODE_AUTH_TOKEN}}
    with:
      package-name: tree-sitter-typescript-next
