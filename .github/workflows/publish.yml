name: Publish packages

# The GitHub release and the tree-sitter-typescript-next crate only; no npm or PyPI
# releases from this fork until someone asks for one. Manual only, so pushing a tag
# never publishes. Run it from a v<version> tag that matches Cargo.toml.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

# No `generate`: these jobs would regenerate the parsers with the latest tree-sitter CLI
# instead of 0.25.10, and `cargo publish` refuses the changed files.
# The shared workflows are pinned to a commit: they receive the crates.io token, and
# their inputs have changed under callers before.
jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Run this workflow from a v<version> tag, not $GITHUB_REF"
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
  github:
    needs: check
    uses: tree-sitter/workflows/.github/workflows/release.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279
  # After the release, so a failed release never leaves a crate (which can't be removed) behind.
  crates:
    needs: github
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
    with:
      package-name: tree-sitter-typescript-next
