name: CI

on:
  push:
    branches: [main]
    paths:
      - "scripts.js"
      - "common/*"
      - "*/grammar.js"
      - "*/src/**"
      - "bindings/**"
      - "binding.gyp"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "scripts.js"
      - "common/*"
      - "*/grammar.js"
      - "*/src/**"
      - "bindings/**"
      - "binding.gyp"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parsers
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: node-gyp 11 does not detect the Visual Studio on windows-latest
        # (Server 2025). macos-14 is no longer a supported runner label.
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Pin the CLI to the version the parsers are generated with: the action's
      # default (latest) broke its own config step at v0.27.1.
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v1
        with:
          tree-sitter-ref: v0.25.10
      # Parsing real code is the differential's job (differential.yml): pinned corpora,
      # tsc as the oracle, a baseline of known gaps. Unpinned HEAD clones made this red
      # whenever upstream projects added syntax the grammar lacks.
      - name: Run tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          # Swift runs in the step below instead. The action's Swift step installs Swift
          # with swift-actions/setup-swift, which verifies signatures against a GPG
          # keyserver; when keyserver.ubuntu.com is unreachable the whole job fails.
          test-swift: false
      # The Ubuntu runner image ships Swift, so no install (and no keyserver) is needed.
      # The action skips Swift on Windows, and the macos-latest image's Swift compiler
      # rejects its own Xcode SDK ("this SDK is not supported by the compiler"), so
      # Ubuntu is the only Swift run, as before.
      - name: Run Swift tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          swift --version
          swift build --build-tests
          swift test --skip-build -q
