name: Fuzz Parser

on:
  push:
    branches: [master]
    paths:
      - typescript/src/scanner.c
      - tsx/src/scanner.c
      - common/scanner.h
  pull_request:
    paths:
      - typescript/src/scanner.c
      - tsx/src/scanner.c
      - common/scanner.h

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, tsx]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fuzz ${{matrix.language}} parser
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        with:
          directory: ${{matrix.language}}
